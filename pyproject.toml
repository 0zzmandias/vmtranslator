[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vmtranslator"
version = "0.1.0"
description = "Tradutor completo da linguagem VM para Assembly Hack (Nand2Tetris Projects 07 e 08)"
requires-python = ">=3.10"

[project.scripts]
vmtranslator = "main.cli:main"

[tool.setuptools.packages.find]
include = ["parser*", "codewriter*", "main*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
